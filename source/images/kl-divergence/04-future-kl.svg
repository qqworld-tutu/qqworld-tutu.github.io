<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1220" height="637.0" viewBox="0 0 1220 637.0" role="img"><title>当前的选择，也会改变未来的 KL</title><style>
:root{--ink:#293b40;--muted:#68767a;--line:#e3e8e8;--q:#4f8fa5;--k:#ca8b4f;--v:#8a74b5;--a:#bb6465;--sans:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;--serif:"Songti SC","Noto Serif CJK SC",serif}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:15px/1.75 var(--sans)}main{max-width:1220px;padding:48px 36px 36px;margin:auto}header{max-width:800px;margin:0 0 30px}h1{font:500 36px/1.3 var(--serif);letter-spacing:.02em;margin:0 0 13px}header p{color:var(--muted);margin:0;font-size:15px}.q{color:var(--q);fill:var(--q)}.k{color:var(--k);fill:var(--k)}.v{color:var(--v);fill:var(--v)}
.formula{font:20px/1.7 Georgia,"Times New Roman",var(--serif);display:flex;flex-wrap:wrap;gap:8px 26px;margin:21px 0 0}.formula sub{font-size:65%}.formula span{white-space:nowrap}
.figure{margin:0}.controls{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;border-block:1px solid var(--line);padding:15px 0;margin:0 0 14px}.head-picker{display:flex;align-items:center;gap:7px}.head-picker>span{margin-right:6px;font-size:13px;color:var(--muted)}button{font:inherit;cursor:pointer;border:0;background:transparent;color:var(--muted);padding:6px 10px;border-radius:4px;min-width:39px;line-height:1.4}button[aria-pressed=true]{background:#eaf2f4;color:#325e6d}button:hover{background:#f0f5f6}button:focus-visible,.diagram-scroll:focus-visible{outline:2px solid var(--q);outline-offset:4px}.sharing{font-size:13px;color:var(--muted);margin:0}.sharing strong{font-weight:500;color:var(--ink)}
.stage{display:grid;grid-template-columns:170px minmax(0,1fr);gap:34px;align-items:center;padding:16px 0}.stage+.stage{border-top:1px solid var(--line)}.step{font:italic 17px Georgia,serif;color:#87969a}.stage h2{font-size:17px;font-weight:600;line-height:1.5;margin:4px 0 8px}.stage p{font-size:13px;line-height:1.85;color:var(--muted);margin:0}.diagram-scroll{min-width:0;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;scrollbar-color:#ccd8dc transparent}.diagram-scroll svg{display:block;width:100%;height:auto;min-width:760px;overflow:visible}svg text{fill:var(--ink);font-family:var(--sans);font-size:15px}.symbol{font-family:Georgia,"Times New Roman",serif;font-size:18px}.shape{fill:var(--muted);font-size:13px}.annotation{font-size:15px}.operation{font-size:16px}.op{font:26px Georgia,serif;fill:#748085}.bracket{fill:none;stroke:#859194;stroke-width:1}.arrow{fill:none;stroke:#8c9291;stroke-width:1.2}.head-divider{stroke:#fff;stroke-width:3}.head-cell{transition:opacity .18s}.head-cell.dim{opacity:.22}svg .q{fill:var(--q)}svg .k{fill:var(--k)}svg .v{fill:var(--v)}
figcaption{border-top:1px solid var(--line);padding-top:20px;margin-top:8px;font-size:12px;color:var(--muted)}.notes{background:#f6f8f8;padding:17px 20px;display:grid;grid-template-columns:40px 1fr;gap:7px 14px;margin:0}.notes dt{font-weight:600;color:#536569}.notes dd{margin:0}.mobile-hint{display:none;font-size:12px;color:var(--muted);margin:0 0 10px}footer{margin-top:17px;font-size:12px;color:var(--muted)}footer a{color:var(--muted);text-underline-offset:4px}noscript p{font-size:13px;color:var(--muted)}
@media(min-width:1000px){.diagram-scroll svg{min-width:0}}
@media(max-width:999px){main{padding:30px 24px}.stage{grid-template-columns:1fr;gap:10px;padding:22px 0}.stage-copy{display:grid;grid-template-columns:26px 150px 1fr;align-items:baseline;gap:10px}.stage h2,.stage p{margin:0}.mobile-hint{display:block}.diagram-scroll svg{min-width:820px}.controls{gap:10px}}
@media(max-width:560px){main{padding:26px 18px}h1{font-size:28px}header p{font-size:14px}.formula{font-size:17px;gap:4px 18px}.head-picker{gap:3px}.sharing{font-size:12px}.stage-copy{grid-template-columns:24px 1fr;gap:4px 10px}.stage-copy p{grid-column:2}.notes{padding:14px;gap:8px 10px}.diagram-scroll svg{min-width:800px}.stage h2{font-size:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{main{padding:0}.controls,footer,.mobile-hint{display:none}.stage{break-inside:avoid;grid-template-columns:150px 1fr;gap:20px}.diagram-scroll{overflow:visible}.diagram-scroll svg{min-width:0}.head-cell.dim{opacity:1}}

html{color-scheme:light}body{background:transparent}main{padding-bottom:22px}header{max-width:100%}.stage-copy{align-self:center}.diagram-scroll svg{overflow:hidden}.formula{font-weight:400}.formula b{font-weight:500}.formula.long{white-space:normal;font-size:19px}.figure-footer{display:flex;gap:22px;flex-wrap:wrap;margin-top:18px;font-size:12px}.figure-footer a{color:var(--muted);text-underline-offset:4px}.operation-node{fill:#f5f8f8;stroke:#d5dfe0;stroke-width:1}.process{font:17px var(--sans)}.process-small{font:14px var(--sans);fill:var(--muted)}.branch{fill:none;stroke:#8c9291;stroke-width:1.2}.dim-path{opacity:.38}.route,.expert,.term-cell,.gradient-path{transition:opacity .15s}.selected-prob{fill:var(--k)}.index-slot{fill:none;stroke:#98a5a8;stroke-width:1}.chart-stage .diagram-scroll img{display:block;width:100%;height:auto;min-width:520px}.chart-stage .diagram-scroll{max-width:100%}.formula .probability{color:var(--q)}.formula .direct{color:var(--v)}.reset-button{font-size:13px;text-decoration:underline;text-underline-offset:3px}.small-label{font-size:12px;color:var(--muted)}button:disabled{opacity:.4;cursor:default}.controls p{flex:1;min-width:200px}.stage-copy p{word-break:normal}.embedded main{padding:16px 0 12px}.embedded h1{font-size:25px}.embedded header>p{font-size:14px}.embedded header{margin-bottom:20px}.embedded .formula{font-size:18px}.embedded .figure-footer{margin-top:14px}.embedded .standalone-link{display:inline}.standalone-link{display:none}.embedded figcaption{font-size:12px}.embedded .notes{padding:14px}.figure-gallery{max-width:1000px;margin:auto;padding:40px 24px}.figure-gallery h1{font-size:30px}.figure-gallery li{margin:12px 0}.figure-gallery a{color:var(--q)}
@media(max-width:999px){.diagram-scroll svg{min-width:760px}.stage-copy{grid-template-columns:34px 155px 1fr}.stage{gap:14px}.stage p{font-size:14px}.mobile-hint{display:none}}
@media(max-width:759px){.mobile-hint{display:block}.stage-copy{grid-template-columns:30px 1fr}.stage-copy p{grid-column:2}.embedded .formula{font-size:16px}.embedded .controls{gap:12px}.embedded .sharing{flex-basis:100%}.embedded h1{font-size:23px}.notes{grid-template-columns:32px 1fr}.formula.long{font-size:16px}.chart-stage .diagram-scroll img{min-width:540px}}
@media print{body{background:white}.figure-footer{display:none}}
svg .shape{font-size:15px}svg .symbol{font-size:20px}svg .annotation{font-size:16px}svg .operation{font-size:17px}.formula.long{display:block;max-width:100%;overflow-x:auto;overflow-y:hidden;padding:4px 0}.formula.long>span+span{margin-left:1.2em}</style><rect width="1220" height="100%" fill="white"/><text style="font-size:28px;font-weight:500" x="34" y="48" text-anchor="start" class="">当前的选择，也会改变未来的 KL</text><text x="34" y="81" text-anchor="start" class="shape">行表示更新哪个位置的概率，列表示使用哪个位置的 log-ratio。选择一行看它包含哪些项。</text><path d="M34,110H1186" stroke="#e3e8e8"/><text x="34" y="150" text-anchor="start" class="shape">t × j</text><text x="34" y="181" text-anchor="start" class="operation">梯度项的结构</text><text x="34" y="217" text-anchor="start" class="shape">白格表示期望中不保留的项</text><text x="34" y="242" text-anchor="start" class="shape">，着色格表示保留的 u_j g_</text><text x="34" y="267" text-anchor="start" class="shape">t。</text><svg x="286" y="120" width="900" height="366.0" viewBox="0 0 900 366"><defs><marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#8c9291" stroke-width="1.2"/></marker></defs><text x="208" y="26" text-anchor="middle" class="operation">序列 KL：当前 + 未来</text><text x="127" y="69" text-anchor="middle" class="symbol">u₁</text><text x="181" y="69" text-anchor="middle" class="symbol">u₂</text><text x="235" y="69" text-anchor="middle" class="symbol">u₃</text><text x="289" y="69" text-anchor="middle" class="symbol">u₄</text><text x="75" y="112" text-anchor="middle" class="symbol">g₁</text><g class="term-cell" data-row="1"><rect x="102" y="85" width="50" height="50" rx="2" fill="#4f8fa5" fill-opacity=".82"/><text x="127" y="114" text-anchor="middle" class="term-label" style="fill:white;font-size:17px">u₁g₁</text></g><g class="term-cell" data-row="1"><rect x="156" y="85" width="50" height="50" rx="2" fill="#4f8fa5" fill-opacity=".82"/><text x="181" y="114" text-anchor="middle" class="term-label" style="fill:white;font-size:17px">u₂g₁</text></g><g class="term-cell" data-row="1"><rect x="210" y="85" width="50" height="50" rx="2" fill="#4f8fa5" fill-opacity=".82"/><text x="235" y="114" text-anchor="middle" class="term-label" style="fill:white;font-size:17px">u₃g₁</text></g><g class="term-cell" data-row="1"><rect x="264" y="85" width="50" height="50" rx="2" fill="#4f8fa5" fill-opacity=".82"/><text x="289" y="114" text-anchor="middle" class="term-label" style="fill:white;font-size:17px">u₄g₁</text></g><text x="75" y="166" text-anchor="middle" class="symbol">g₂</text><rect x="102" y="139" width="50" height="50" rx="2" fill="none" stroke="#e3e8e8"/><g class="term-cell" data-row="2"><rect x="156" y="139" width="50" height="50" rx="2" fill="#4f8fa5" fill-opacity=".82"/><text x="181" y="168" text-anchor="middle" class="term-label" style="fill:white;font-size:17px">u₂g₂</text></g><g class="term-cell" data-row="2"><rect x="210" y="139" width="50" height="50" rx="2" fill="#4f8fa5" fill-opacity=".82"/><text x="235" y="168" text-anchor="middle" class="term-label" style="fill:white;font-size:17px">u₃g₂</text></g><g class="term-cell" data-row="2"><rect x="264" y="139" width="50" height="50" rx="2" fill="#4f8fa5" fill-opacity=".82"/><text x="289" y="168" text-anchor="middle" class="term-label" style="fill:white;font-size:17px">u₄g₂</text></g><text x="75" y="220" text-anchor="middle" class="symbol">g₃</text><rect x="102" y="193" width="50" height="50" rx="2" fill="none" stroke="#e3e8e8"/><rect x="156" y="193" width="50" height="50" rx="2" fill="none" stroke="#e3e8e8"/><g class="term-cell" data-row="3"><rect x="210" y="193" width="50" height="50" rx="2" fill="#4f8fa5" fill-opacity=".82"/><text x="235" y="222" text-anchor="middle" class="term-label" style="fill:white;font-size:17px">u₃g₃</text></g><g class="term-cell" data-row="3"><rect x="264" y="193" width="50" height="50" rx="2" fill="#4f8fa5" fill-opacity=".82"/><text x="289" y="222" text-anchor="middle" class="term-label" style="fill:white;font-size:17px">u₄g₃</text></g><text x="75" y="274" text-anchor="middle" class="symbol">g₄</text><rect x="102" y="247" width="50" height="50" rx="2" fill="none" stroke="#e3e8e8"/><rect x="156" y="247" width="50" height="50" rx="2" fill="none" stroke="#e3e8e8"/><rect x="210" y="247" width="50" height="50" rx="2" fill="none" stroke="#e3e8e8"/><g class="term-cell" data-row="4"><rect x="264" y="247" width="50" height="50" rx="2" fill="#4f8fa5" fill-opacity=".82"/><text x="289" y="276" text-anchor="middle" class="term-label" style="fill:white;font-size:17px">u₄g₄</text></g><text x="208" y="334" text-anchor="middle" class="shape">列：哪个位置的 log-ratio</text><text x="676" y="26" text-anchor="middle" class="operation">局部 token KL：只看当前</text><text x="595" y="69" text-anchor="middle" class="symbol">u₁</text><text x="649" y="69" text-anchor="middle" class="symbol">u₂</text><text x="703" y="69" text-anchor="middle" class="symbol">u₃</text><text x="757" y="69" text-anchor="middle" class="symbol">u₄</text><text x="543" y="112" text-anchor="middle" class="symbol">g₁</text><g class="term-cell" data-row="1"><rect x="570" y="85" width="50" height="50" rx="2" fill="#8a74b5" fill-opacity=".82"/><text x="595" y="114" text-anchor="middle" class="term-label" style="fill:white;font-size:17px">u₁g₁</text></g><rect x="624" y="85" width="50" height="50" rx="2" fill="none" stroke="#e3e8e8"/><rect x="678" y="85" width="50" height="50" rx="2" fill="none" stroke="#e3e8e8"/><rect x="732" y="85" width="50" height="50" rx="2" fill="none" stroke="#e3e8e8"/><text x="543" y="166" text-anchor="middle" class="symbol">g₂</text><rect x="570" y="139" width="50" height="50" rx="2" fill="none" stroke="#e3e8e8"/><g class="term-cell" data-row="2"><rect x="624" y="139" width="50" height="50" rx="2" fill="#8a74b5" fill-opacity=".82"/><text x="649" y="168" text-anchor="middle" class="term-label" style="fill:white;font-size:17px">u₂g₂</text></g><rect x="678" y="139" width="50" height="50" rx="2" fill="none" stroke="#e3e8e8"/><rect x="732" y="139" width="50" height="50" rx="2" fill="none" stroke="#e3e8e8"/><text x="543" y="220" text-anchor="middle" class="symbol">g₃</text><rect x="570" y="193" width="50" height="50" rx="2" fill="none" stroke="#e3e8e8"/><rect x="624" y="193" width="50" height="50" rx="2" fill="none" stroke="#e3e8e8"/><g class="term-cell" data-row="3"><rect x="678" y="193" width="50" height="50" rx="2" fill="#8a74b5" fill-opacity=".82"/><text x="703" y="222" text-anchor="middle" class="term-label" style="fill:white;font-size:17px">u₃g₃</text></g><rect x="732" y="193" width="50" height="50" rx="2" fill="none" stroke="#e3e8e8"/><text x="543" y="274" text-anchor="middle" class="symbol">g₄</text><rect x="570" y="247" width="50" height="50" rx="2" fill="none" stroke="#e3e8e8"/><rect x="624" y="247" width="50" height="50" rx="2" fill="none" stroke="#e3e8e8"/><rect x="678" y="247" width="50" height="50" rx="2" fill="none" stroke="#e3e8e8"/><g class="term-cell" data-row="4"><rect x="732" y="247" width="50" height="50" rx="2" fill="#8a74b5" fill-opacity=".82"/><text x="757" y="276" text-anchor="middle" class="term-label" style="fill:white;font-size:17px">u₄g₄</text></g><text x="676" y="334" text-anchor="middle" class="shape">列：哪个位置的 log-ratio</text></svg><text x="34" y="546.0" text-anchor="start" class="shape">定义：u_j = log[Pθ(y_j | h_j) / Q(y_j | h_j)]；g_t = ∇θ log Pθ(y_t | h_t)。</text><text x="34" y="578.0" text-anchor="start" class="shape">机制：过去项 j  t 一般不能删，因为当前选择会改变后续前缀。</text><text x="34" y="610.0" text-anchor="start" class="shape">边界：图示为期望梯度的组成关系，不表示两种采样估计在每条轨迹上数值相同。</text></svg>