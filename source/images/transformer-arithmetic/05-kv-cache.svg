<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1220" height="1044.0" viewBox="0 0 1220 1044.0" role="img"><title>KV Cache 的追加与读取</title><style>
:root{--ink:#293b40;--muted:#68767a;--line:#e3e8e8;--q:#4f8fa5;--k:#ca8b4f;--v:#8a74b5;--a:#bb6465;--sans:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;--serif:"Songti SC","Noto Serif CJK SC",serif}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:15px/1.75 var(--sans)}main{max-width:1220px;padding:48px 36px 36px;margin:auto}header{max-width:800px;margin:0 0 30px}h1{font:500 36px/1.3 var(--serif);letter-spacing:.02em;margin:0 0 13px}header p{color:var(--muted);margin:0;font-size:15px}.q{color:var(--q);fill:var(--q)}.k{color:var(--k);fill:var(--k)}.v{color:var(--v);fill:var(--v)}
.formula{font:20px/1.7 Georgia,"Times New Roman",var(--serif);display:flex;flex-wrap:wrap;gap:8px 26px;margin:21px 0 0}.formula sub{font-size:65%}.formula span{white-space:nowrap}
.figure{margin:0}.controls{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;border-block:1px solid var(--line);padding:15px 0;margin:0 0 14px}.head-picker{display:flex;align-items:center;gap:7px}.head-picker>span{margin-right:6px;font-size:13px;color:var(--muted)}button{font:inherit;cursor:pointer;border:0;background:transparent;color:var(--muted);padding:6px 10px;border-radius:4px;min-width:39px;line-height:1.4}button[aria-pressed=true]{background:#eaf2f4;color:#325e6d}button:hover{background:#f0f5f6}button:focus-visible,.diagram-scroll:focus-visible{outline:2px solid var(--q);outline-offset:4px}.sharing{font-size:13px;color:var(--muted);margin:0}.sharing strong{font-weight:500;color:var(--ink)}
.stage{display:grid;grid-template-columns:170px minmax(0,1fr);gap:34px;align-items:center;padding:16px 0}.stage+.stage{border-top:1px solid var(--line)}.step{font:italic 17px Georgia,serif;color:#87969a}.stage h2{font-size:17px;font-weight:600;line-height:1.5;margin:4px 0 8px}.stage p{font-size:13px;line-height:1.85;color:var(--muted);margin:0}.diagram-scroll{min-width:0;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;scrollbar-color:#ccd8dc transparent}.diagram-scroll svg{display:block;width:100%;height:auto;min-width:760px;overflow:visible}svg text{fill:var(--ink);font-family:var(--sans);font-size:15px}.symbol{font-family:Georgia,"Times New Roman",serif;font-size:18px}.shape{fill:var(--muted);font-size:13px}.annotation{font-size:15px}.operation{font-size:16px}.op{font:26px Georgia,serif;fill:#748085}.bracket{fill:none;stroke:#859194;stroke-width:1}.arrow{fill:none;stroke:#8c9291;stroke-width:1.2}.head-divider{stroke:#fff;stroke-width:3}.head-cell{transition:opacity .18s}.head-cell.dim{opacity:.22}svg .q{fill:var(--q)}svg .k{fill:var(--k)}svg .v{fill:var(--v)}
figcaption{border-top:1px solid var(--line);padding-top:20px;margin-top:8px;font-size:12px;color:var(--muted)}.notes{background:#f6f8f8;padding:17px 20px;display:grid;grid-template-columns:40px 1fr;gap:7px 14px;margin:0}.notes dt{font-weight:600;color:#536569}.notes dd{margin:0}.mobile-hint{display:none;font-size:12px;color:var(--muted);margin:0 0 10px}footer{margin-top:17px;font-size:12px;color:var(--muted)}footer a{color:var(--muted);text-underline-offset:4px}noscript p{font-size:13px;color:var(--muted)}
@media(min-width:1000px){.diagram-scroll svg{min-width:0}}
@media(max-width:999px){main{padding:30px 24px}.stage{grid-template-columns:1fr;gap:10px;padding:22px 0}.stage-copy{display:grid;grid-template-columns:26px 150px 1fr;align-items:baseline;gap:10px}.stage h2,.stage p{margin:0}.mobile-hint{display:block}.diagram-scroll svg{min-width:820px}.controls{gap:10px}}
@media(max-width:560px){main{padding:26px 18px}h1{font-size:28px}header p{font-size:14px}.formula{font-size:17px;gap:4px 18px}.head-picker{gap:3px}.sharing{font-size:12px}.stage-copy{grid-template-columns:24px 1fr;gap:4px 10px}.stage-copy p{grid-column:2}.notes{padding:14px;gap:8px 10px}.diagram-scroll svg{min-width:800px}.stage h2{font-size:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{main{padding:0}.controls,footer,.mobile-hint{display:none}.stage{break-inside:avoid;grid-template-columns:150px 1fr;gap:20px}.diagram-scroll{overflow:visible}.diagram-scroll svg{min-width:0}.head-cell.dim{opacity:1}}

html{color-scheme:light}body{background:transparent}main{padding-bottom:22px}header{max-width:100%}.stage-copy{align-self:center}.diagram-scroll svg{overflow:hidden}.formula{font-weight:400}.formula b{font-weight:500}.formula.long{white-space:normal;font-size:19px}.figure-footer{display:flex;gap:22px;flex-wrap:wrap;margin-top:18px;font-size:12px}.figure-footer a{color:var(--muted);text-underline-offset:4px}.operation-node{fill:#f5f8f8;stroke:#d5dfe0;stroke-width:1}.process{font:17px var(--sans)}.process-small{font:14px var(--sans);fill:var(--muted)}.branch{fill:none;stroke:#8c9291;stroke-width:1.2}.dim-path{opacity:.38}.route,.expert,.term-cell,.gradient-path{transition:opacity .15s}.selected-prob{fill:var(--k)}.index-slot{fill:none;stroke:#98a5a8;stroke-width:1}.chart-stage .diagram-scroll img{display:block;width:100%;height:auto;min-width:520px}.chart-stage .diagram-scroll{max-width:100%}.formula .probability{color:var(--q)}.formula .direct{color:var(--v)}.reset-button{font-size:13px;text-decoration:underline;text-underline-offset:3px}.small-label{font-size:12px;color:var(--muted)}button:disabled{opacity:.4;cursor:default}.controls p{flex:1;min-width:200px}.stage-copy p{word-break:normal}.embedded main{padding:16px 0 12px}.embedded h1{font-size:25px}.embedded header>p{font-size:14px}.embedded header{margin-bottom:20px}.embedded .formula{font-size:18px}.embedded .figure-footer{margin-top:14px}.embedded .standalone-link{display:inline}.standalone-link{display:none}.embedded figcaption{font-size:12px}.embedded .notes{padding:14px}.figure-gallery{max-width:1000px;margin:auto;padding:40px 24px}.figure-gallery h1{font-size:30px}.figure-gallery li{margin:12px 0}.figure-gallery a{color:var(--q)}
@media(max-width:999px){.diagram-scroll svg{min-width:760px}.stage-copy{grid-template-columns:34px 155px 1fr}.stage{gap:14px}.stage p{font-size:14px}.mobile-hint{display:none}}
@media(max-width:759px){.mobile-hint{display:block}.stage-copy{grid-template-columns:30px 1fr}.stage-copy p{grid-column:2}.embedded .formula{font-size:16px}.embedded .controls{gap:12px}.embedded .sharing{flex-basis:100%}.embedded h1{font-size:23px}.notes{grid-template-columns:32px 1fr}.formula.long{font-size:16px}.chart-stage .diagram-scroll img{min-width:540px}}
@media print{body{background:white}.figure-footer{display:none}}
svg .shape{font-size:15px}svg .symbol{font-size:20px}svg .annotation{font-size:16px}svg .operation{font-size:17px}.formula.long{display:block;max-width:100%;overflow-x:auto;overflow-y:hidden;padding:4px 0}.formula.long>span+span{margin-left:1.2em}</style><rect width="1220" height="100%" fill="white"/><text style="font-size:28px;font-weight:500" x="34" y="48" text-anchor="start" class="">KV Cache 的追加与读取</text><text x="34" y="81" text-anchor="start" class="shape">示例从 3 个 prompt token 的 prefill 开始，展示后续 decode 中缓存的变化。</text><path d="M34,110H1186" stroke="#e3e8e8"/><text x="34" y="150" text-anchor="start" class="shape">01</text><text x="34" y="181" text-anchor="start" class="operation">更新缓存</text><text x="34" y="217" text-anchor="start" class="shape">取一层中的一组 KV 头，K </text><text x="34" y="242" text-anchor="start" class="shape">和 V 分别沿位置轴追加当前</text><text x="34" y="267" text-anchor="start" class="shape"> token 的一行。</text><svg x="286" y="120" width="900" height="365.0" viewBox="0 0 900 365"><defs><marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#8c9291" stroke-width="1.2"/></marker></defs><g class="matrix" data-rows="3" data-cols="2"><rect x="31" y="21" width="14" height="14" rx="1.5" fill="#ca8b4f" fill-opacity="0.42"/><rect x="47" y="21" width="14" height="14" rx="1.5" fill="#ca8b4f" fill-opacity="0.65"/><rect x="31" y="37" width="14" height="14" rx="1.5" fill="#ca8b4f" fill-opacity="0.86"/><rect x="47" y="37" width="14" height="14" rx="1.5" fill="#ca8b4f" fill-opacity="0.86"/><rect x="31" y="53" width="14" height="14" rx="1.5" fill="#ca8b4f" fill-opacity="0.86"/><rect x="47" y="53" width="14" height="14" rx="1.5" fill="#ca8b4f" fill-opacity="0.86"/><path class="bracket" d="M27,20h-4v48h4 M65,20h4v48h-4"/><text x="46" y="97" text-anchor="middle" class="symbol">K旧</text><text x="46" y="120" text-anchor="middle" class="shape">3 × 2</text></g><text x="150" y="50" text-anchor="middle" class="operation">追加</text><g class="matrix" data-rows="1" data-cols="2"><rect x="240" y="21" width="14" height="14" rx="1.5" fill="#ca8b4f" fill-opacity="0.42"/><rect x="256" y="21" width="14" height="14" rx="1.5" fill="#ca8b4f" fill-opacity="0.65"/><path class="bracket" d="M236,20h-4v16h4 M274,20h4v16h-4"/><text x="255" y="65" text-anchor="middle" class="symbol">K新</text><text x="255" y="88" text-anchor="middle" class="shape">1 × 2</text></g><path class="arrow" d="M312,43H384" marker-end="url(#tip)"/><g class="matrix" data-rows="4" data-cols="2"><rect x="438" y="21" width="14" height="14" rx="1.5" fill="#ca8b4f" fill-opacity="0.42"/><rect x="454" y="21" width="14" height="14" rx="1.5" fill="#ca8b4f" fill-opacity="0.65"/><rect x="438" y="37" width="14" height="14" rx="1.5" fill="#ca8b4f" fill-opacity="0.86"/><rect x="454" y="37" width="14" height="14" rx="1.5" fill="#ca8b4f" fill-opacity="0.86"/><rect x="438" y="53" width="14" height="14" rx="1.5" fill="#ca8b4f" fill-opacity="0.86"/><rect x="454" y="53" width="14" height="14" rx="1.5" fill="#ca8b4f" fill-opacity="0.86"/><rect x="438" y="69" width="14" height="14" rx="1.5" fill="#ca8b4f" fill-opacity="0.65"/><rect x="454" y="69" width="14" height="14" rx="1.5" fill="#ca8b4f" fill-opacity="0.65"/><path class="bracket" d="M434,20h-4v64h4 M472,20h4v64h-4"/><text x="453" y="113" text-anchor="middle" class="symbol">K</text><text x="453" y="136" text-anchor="middle" class="shape">4 × 2</text></g><text x="680" y="49" text-anchor="middle" class="annotation">沿位置轴追加当前 K/V</text><g class="matrix" data-rows="3" data-cols="2"><rect x="31" y="189" width="14" height="14" rx="1.5" fill="#8a74b5" fill-opacity="0.42"/><rect x="47" y="189" width="14" height="14" rx="1.5" fill="#8a74b5" fill-opacity="0.65"/><rect x="31" y="205" width="14" height="14" rx="1.5" fill="#8a74b5" fill-opacity="0.86"/><rect x="47" y="205" width="14" height="14" rx="1.5" fill="#8a74b5" fill-opacity="0.86"/><rect x="31" y="221" width="14" height="14" rx="1.5" fill="#8a74b5" fill-opacity="0.86"/><rect x="47" y="221" width="14" height="14" rx="1.5" fill="#8a74b5" fill-opacity="0.86"/><path class="bracket" d="M27,188h-4v48h4 M65,188h4v48h-4"/><text x="46" y="265" text-anchor="middle" class="symbol">V旧</text><text x="46" y="288" text-anchor="middle" class="shape">3 × 2</text></g><text x="150" y="218" text-anchor="middle" class="operation">追加</text><g class="matrix" data-rows="1" data-cols="2"><rect x="240" y="189" width="14" height="14" rx="1.5" fill="#8a74b5" fill-opacity="0.42"/><rect x="256" y="189" width="14" height="14" rx="1.5" fill="#8a74b5" fill-opacity="0.65"/><path class="bracket" d="M236,188h-4v16h4 M274,188h4v16h-4"/><text x="255" y="233" text-anchor="middle" class="symbol">V新</text><text x="255" y="256" text-anchor="middle" class="shape">1 × 2</text></g><path class="arrow" d="M312,211H384" marker-end="url(#tip)"/><g class="matrix" data-rows="4" data-cols="2"><rect x="438" y="189" width="14" height="14" rx="1.5" fill="#8a74b5" fill-opacity="0.42"/><rect x="454" y="189" width="14" height="14" rx="1.5" fill="#8a74b5" fill-opacity="0.65"/><rect x="438" y="205" width="14" height="14" rx="1.5" fill="#8a74b5" fill-opacity="0.86"/><rect x="454" y="205" width="14" height="14" rx="1.5" fill="#8a74b5" fill-opacity="0.86"/><rect x="438" y="221" width="14" height="14" rx="1.5" fill="#8a74b5" fill-opacity="0.86"/><rect x="454" y="221" width="14" height="14" rx="1.5" fill="#8a74b5" fill-opacity="0.86"/><rect x="438" y="237" width="14" height="14" rx="1.5" fill="#8a74b5" fill-opacity="0.65"/><rect x="454" y="237" width="14" height="14" rx="1.5" fill="#8a74b5" fill-opacity="0.65"/><path class="bracket" d="M434,188h-4v64h4 M472,188h4v64h-4"/><text x="453" y="281" text-anchor="middle" class="symbol">V</text><text x="453" y="304" text-anchor="middle" class="shape">4 × 2</text></g><text x="680" y="217" text-anchor="middle" class="annotation">沿位置轴追加当前 K/V</text></svg><path d="M34,510.0H1186" stroke="#e3e8e8"/><text x="34" y="550.0" text-anchor="start" class="shape">02</text><text x="34" y="581.0" text-anchor="start" class="operation">读取 Key 缓存</text><text x="34" y="617.0" text-anchor="start" class="shape">当前 Query 与缓存中的全部</text><text x="34" y="642.0" text-anchor="start" class="shape"> Key 匹配，得到各位置的注</text><text x="34" y="667.0" text-anchor="start" class="shape">意力概率。</text><svg x="286" y="520.0" width="900" height="114.0" viewBox="0 0 900 114"><defs><marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#8c9291" stroke-width="1.2"/></marker></defs><g class="matrix" data-rows="1" data-cols="2"><rect x="26" y="21" width="14" height="14" rx="1.5" fill="#4f8fa5" fill-opacity="0.42"/><rect x="42" y="21" width="14" height="14" rx="1.5" fill="#4f8fa5" fill-opacity="0.65"/><path class="bracket" d="M22,20h-4v16h4 M60,20h4v16h-4"/><text x="41" y="65" text-anchor="middle" class="symbol">q</text><text x="41" y="88" text-anchor="middle" class="shape">1 × 2</text></g><text x="94" y="43" text-anchor="middle" class="op">×</text><g class="matrix" data-rows="2" data-cols="4"><rect x="134" y="13" width="14" height="14" rx="1.5" fill="#ca8b4f" fill-opacity="0.42"/><rect x="150" y="13" width="14" height="14" rx="1.5" fill="#ca8b4f" fill-opacity="0.65"/><rect x="166" y="13" width="14" height="14" rx="1.5" fill="#ca8b4f" fill-opacity="0.86"/><rect x="182" y="13" width="14" height="14" rx="1.5" fill="#ca8b4f" fill-opacity="0.65"/><rect x="134" y="29" width="14" height="14" rx="1.5" fill="#ca8b4f" fill-opacity="0.86"/><rect x="150" y="29" width="14" height="14" rx="1.5" fill="#ca8b4f" fill-opacity="0.86"/><rect x="166" y="29" width="14" height="14" rx="1.5" fill="#ca8b4f" fill-opacity="0.42"/><rect x="182" y="29" width="14" height="14" rx="1.5" fill="#ca8b4f" fill-opacity="0.65"/><path class="bracket" d="M130,12h-4v32h4 M200,12h4v32h-4"/><text x="165" y="73" text-anchor="middle" class="symbol">Kᵀ</text><text x="165" y="96" text-anchor="middle" class="shape">2 × 4</text></g><path class="arrow" d="M265,28H309" marker-end="url(#tip)"/><text x="400" y="32" text-anchor="middle" class="operation">缩放 → softmax</text><path class="arrow" d="M490,28H529" marker-end="url(#tip)"/><g class="matrix" data-rows="1" data-cols="4"><rect x="575" y="21" width="14" height="14" rx="1.5" fill="#bb6465" fill-opacity="0.42"/><rect x="591" y="21" width="14" height="14" rx="1.5" fill="#bb6465" fill-opacity="0.65"/><rect x="607" y="21" width="14" height="14" rx="1.5" fill="#bb6465" fill-opacity="0.86"/><rect x="623" y="21" width="14" height="14" rx="1.5" fill="#bb6465" fill-opacity="0.65"/><path class="bracket" d="M571,20h-4v16h4 M641,20h4v16h-4"/><text x="606" y="65" text-anchor="middle" class="symbol">a</text><text x="606" y="88" text-anchor="middle" class="shape">1 × 4</text></g></svg><path d="M34,710.0H1186" stroke="#e3e8e8"/><text x="34" y="750.0" text-anchor="start" class="shape">03</text><text x="34" y="781.0" text-anchor="start" class="operation">汇总 Value 缓存</text><text x="34" y="817.0" text-anchor="start" class="shape">按注意力概率对缓存中的 Va</text><text x="34" y="842.0" text-anchor="start" class="shape">lue 加权求和，K/V 继续保</text><text x="34" y="867.0" text-anchor="start" class="shape">留供后续步骤使用。</text><svg x="286" y="720.0" width="900" height="173.0" viewBox="0 0 900 173"><defs><marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#8c9291" stroke-width="1.2"/></marker></defs><g class="matrix" data-rows="1" data-cols="4"><rect x="26" y="46" width="14" height="14" rx="1.5" fill="#bb6465" fill-opacity="0.42"/><rect x="42" y="46" width="14" height="14" rx="1.5" fill="#bb6465" fill-opacity="0.65"/><rect x="58" y="46" width="14" height="14" rx="1.5" fill="#bb6465" fill-opacity="0.86"/><rect x="74" y="46" width="14" height="14" rx="1.5" fill="#bb6465" fill-opacity="0.65"/><path class="bracket" d="M22,45h-4v16h4 M92,45h4v16h-4"/><text x="57" y="90" text-anchor="middle" class="symbol">a</text><text x="57" y="113" text-anchor="middle" class="shape">1 × 4</text></g><text x="164" y="67" text-anchor="middle" class="op">×</text><g class="matrix" data-rows="4" data-cols="2"><rect x="212" y="14" width="14" height="14" rx="1.5" fill="#8a74b5" fill-opacity="0.42"/><rect x="228" y="14" width="14" height="14" rx="1.5" fill="#8a74b5" fill-opacity="0.65"/><rect x="212" y="30" width="14" height="14" rx="1.5" fill="#8a74b5" fill-opacity="0.86"/><rect x="228" y="30" width="14" height="14" rx="1.5" fill="#8a74b5" fill-opacity="0.86"/><rect x="212" y="46" width="14" height="14" rx="1.5" fill="#8a74b5" fill-opacity="0.86"/><rect x="228" y="46" width="14" height="14" rx="1.5" fill="#8a74b5" fill-opacity="0.86"/><rect x="212" y="62" width="14" height="14" rx="1.5" fill="#8a74b5" fill-opacity="0.65"/><rect x="228" y="62" width="14" height="14" rx="1.5" fill="#8a74b5" fill-opacity="0.65"/><path class="bracket" d="M208,13h-4v64h4 M246,13h4v64h-4"/><text x="227" y="106" text-anchor="middle" class="symbol">V</text><text x="227" y="129" text-anchor="middle" class="shape">4 × 2</text></g><text x="296" y="67" text-anchor="middle" class="op">=</text><g class="matrix" data-rows="1" data-cols="2"><rect x="349" y="46" width="14" height="14" rx="1.5" fill="#4f8fa5" fill-opacity="0.42"/><rect x="365" y="46" width="14" height="14" rx="1.5" fill="#4f8fa5" fill-opacity="0.65"/><path class="bracket" d="M345,45h-4v16h4 M383,45h4v16h-4"/><text x="364" y="90" text-anchor="middle" class="symbol">H</text><text x="364" y="113" text-anchor="middle" class="shape">1 × 2</text></g><text x="652" y="48" text-anchor="middle" class="annotation">各头输出拼接后乘 W_O</text><text x="652" y="83" text-anchor="middle" class="shape">得到当前 token 的注意力输出</text></svg><text x="34" y="953.0" text-anchor="start" class="shape">维度：取 B = 1、d_h = 2，图中展示一组 KV 头。单层完整 K/V 的形状均为 B × n_kv × T × d_h。</text><text x="34" y="985.0" text-anchor="start" class="shape">对象：缓存包含应用 RoPE 后的 K，以及未经 RoPE 的 V。Q 仅用于当前步骤，色块深浅仅作数值示意。</text><text x="34" y="1017.0" text-anchor="start" class="shape">容量：L 层缓存共包含 2 B L n_kv T d_h 个元素。图中展示位置的追加过程，实际实现可通过预分配等方式管理内存。</text></svg>