<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1220" height="975.0" viewBox="0 0 1220 975.0" role="img"><title>MoE 的路由与加权汇总</title><style>
:root{--ink:#293b40;--muted:#68767a;--line:#e3e8e8;--q:#4f8fa5;--k:#ca8b4f;--v:#8a74b5;--a:#bb6465;--sans:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;--serif:"Songti SC","Noto Serif CJK SC",serif}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:15px/1.75 var(--sans)}main{max-width:1220px;padding:48px 36px 36px;margin:auto}header{max-width:800px;margin:0 0 30px}h1{font:500 36px/1.3 var(--serif);letter-spacing:.02em;margin:0 0 13px}header p{color:var(--muted);margin:0;font-size:15px}.q{color:var(--q);fill:var(--q)}.k{color:var(--k);fill:var(--k)}.v{color:var(--v);fill:var(--v)}
.formula{font:20px/1.7 Georgia,"Times New Roman",var(--serif);display:flex;flex-wrap:wrap;gap:8px 26px;margin:21px 0 0}.formula sub{font-size:65%}.formula span{white-space:nowrap}
.figure{margin:0}.controls{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;border-block:1px solid var(--line);padding:15px 0;margin:0 0 14px}.head-picker{display:flex;align-items:center;gap:7px}.head-picker>span{margin-right:6px;font-size:13px;color:var(--muted)}button{font:inherit;cursor:pointer;border:0;background:transparent;color:var(--muted);padding:6px 10px;border-radius:4px;min-width:39px;line-height:1.4}button[aria-pressed=true]{background:#eaf2f4;color:#325e6d}button:hover{background:#f0f5f6}button:focus-visible,.diagram-scroll:focus-visible{outline:2px solid var(--q);outline-offset:4px}.sharing{font-size:13px;color:var(--muted);margin:0}.sharing strong{font-weight:500;color:var(--ink)}
.stage{display:grid;grid-template-columns:170px minmax(0,1fr);gap:34px;align-items:center;padding:16px 0}.stage+.stage{border-top:1px solid var(--line)}.step{font:italic 17px Georgia,serif;color:#87969a}.stage h2{font-size:17px;font-weight:600;line-height:1.5;margin:4px 0 8px}.stage p{font-size:13px;line-height:1.85;color:var(--muted);margin:0}.diagram-scroll{min-width:0;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;scrollbar-color:#ccd8dc transparent}.diagram-scroll svg{display:block;width:100%;height:auto;min-width:760px;overflow:visible}svg text{fill:var(--ink);font-family:var(--sans);font-size:15px}.symbol{font-family:Georgia,"Times New Roman",serif;font-size:18px}.shape{fill:var(--muted);font-size:13px}.annotation{font-size:15px}.operation{font-size:16px}.op{font:26px Georgia,serif;fill:#748085}.bracket{fill:none;stroke:#859194;stroke-width:1}.arrow{fill:none;stroke:#8c9291;stroke-width:1.2}.head-divider{stroke:#fff;stroke-width:3}.head-cell{transition:opacity .18s}.head-cell.dim{opacity:.22}svg .q{fill:var(--q)}svg .k{fill:var(--k)}svg .v{fill:var(--v)}
figcaption{border-top:1px solid var(--line);padding-top:20px;margin-top:8px;font-size:12px;color:var(--muted)}.notes{background:#f6f8f8;padding:17px 20px;display:grid;grid-template-columns:40px 1fr;gap:7px 14px;margin:0}.notes dt{font-weight:600;color:#536569}.notes dd{margin:0}.mobile-hint{display:none;font-size:12px;color:var(--muted);margin:0 0 10px}footer{margin-top:17px;font-size:12px;color:var(--muted)}footer a{color:var(--muted);text-underline-offset:4px}noscript p{font-size:13px;color:var(--muted)}
@media(min-width:1000px){.diagram-scroll svg{min-width:0}}
@media(max-width:999px){main{padding:30px 24px}.stage{grid-template-columns:1fr;gap:10px;padding:22px 0}.stage-copy{display:grid;grid-template-columns:26px 150px 1fr;align-items:baseline;gap:10px}.stage h2,.stage p{margin:0}.mobile-hint{display:block}.diagram-scroll svg{min-width:820px}.controls{gap:10px}}
@media(max-width:560px){main{padding:26px 18px}h1{font-size:28px}header p{font-size:14px}.formula{font-size:17px;gap:4px 18px}.head-picker{gap:3px}.sharing{font-size:12px}.stage-copy{grid-template-columns:24px 1fr;gap:4px 10px}.stage-copy p{grid-column:2}.notes{padding:14px;gap:8px 10px}.diagram-scroll svg{min-width:800px}.stage h2{font-size:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{main{padding:0}.controls,footer,.mobile-hint{display:none}.stage{break-inside:avoid;grid-template-columns:150px 1fr;gap:20px}.diagram-scroll{overflow:visible}.diagram-scroll svg{min-width:0}.head-cell.dim{opacity:1}}

html{color-scheme:light;background:#fafbf8}html.embedded{background:transparent;overflow:hidden;scrollbar-gutter:auto}html.embedded body{overflow:hidden}html.embedded,html.embedded body{scrollbar-width:none}html.embedded::-webkit-scrollbar,html.embedded body::-webkit-scrollbar{display:none;width:0;height:0}body{background:transparent}main{padding-bottom:22px}header{max-width:100%}.stage-copy{align-self:center}.diagram-scroll svg{overflow:hidden}.formula{font-weight:400}.formula b{font-weight:500}.formula.long{white-space:normal;font-size:19px}.figure-footer{display:flex;gap:22px;flex-wrap:wrap;margin-top:18px;font-size:12px}.figure-footer a{color:var(--muted);text-underline-offset:4px}.operation-node{fill:#f5f8f8;stroke:#d5dfe0;stroke-width:1}.process{font:17px var(--sans)}.process-small{font:14px var(--sans);fill:var(--muted)}.branch{fill:none;stroke:#8c9291;stroke-width:1.2}.dim-path{opacity:.38}.route,.expert,.term-cell,.gradient-path{transition:opacity .15s}.selected-prob{fill:var(--k)}.index-slot{fill:none;stroke:#98a5a8;stroke-width:1}.chart-stage .diagram-scroll img{display:block;width:100%;height:auto;min-width:520px}.chart-stage .diagram-scroll{max-width:100%}.formula .probability{color:var(--q)}.formula .direct{color:var(--v)}.reset-button{font-size:13px;text-decoration:underline;text-underline-offset:3px}.small-label{font-size:12px;color:var(--muted)}button:disabled{opacity:.4;cursor:default}.controls p{flex:1;min-width:200px}.stage-copy p{word-break:normal}.embedded main{padding:16px 0 12px}.embedded h1{font-size:25px}.embedded header>p{font-size:14px}.embedded header{margin-bottom:20px}.embedded .formula{font-size:18px}.embedded .figure-footer{margin-top:14px}.embedded .standalone-link{display:inline}.standalone-link{display:none}.embedded figcaption{font-size:12px}.embedded .notes{padding:14px}.figure-gallery{max-width:1000px;margin:auto;padding:40px 24px}.figure-gallery h1{font-size:30px}.figure-gallery li{margin:12px 0}.figure-gallery a{color:var(--q)}
@media(max-width:999px){.diagram-scroll svg{min-width:760px}.stage-copy{grid-template-columns:34px 155px 1fr}.stage{gap:14px}.stage p{font-size:14px}.mobile-hint{display:none}}
@media(max-width:759px){.mobile-hint{display:block}.stage-copy{grid-template-columns:30px 1fr}.stage-copy p{grid-column:2}.embedded .formula{font-size:16px}.embedded .controls{gap:12px}.embedded .sharing{flex-basis:100%}.embedded h1{font-size:23px}.notes{grid-template-columns:32px 1fr}.formula.long{font-size:16px}.chart-stage .diagram-scroll img{min-width:540px}}
@media print{body{background:white}.figure-footer{display:none}}
svg .shape{font-size:15px}svg .symbol{font-size:20px}svg .annotation{font-size:16px}svg .operation{font-size:17px}.formula.long{display:block;max-width:100%;overflow-x:auto;overflow-y:hidden;padding:4px 0}.formula.long>span+span{margin-left:1.2em}</style><rect width="1220" height="100%" fill="#fafbf8"/><text style="font-size:28px;font-weight:500" x="34" y="48" text-anchor="start" class="">MoE 的路由与加权汇总</text><text x="34" y="81" text-anchor="start" class="shape">Router 为每个 token 选择 4 个专家中的 2 个，并确定其输出的混合权重。</text><path d="M34,110H1186" stroke="#e3e8e8"/><text x="34" y="150" text-anchor="start" class="shape">01</text><text x="34" y="181" text-anchor="start" class="operation">路由概率</text><text x="34" y="217" text-anchor="start" class="shape">路由分数 xW_r 经 softmax </text><text x="34" y="242" text-anchor="start" class="shape">转为专家概率，图中以柱高</text><text x="34" y="267" text-anchor="start" class="shape">表示。</text><svg x="286" y="120" width="900" height="225.0" viewBox="0 0 900 225"><defs><marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#8c9291" stroke-width="1.2"/></marker></defs><text x="120" y="21" text-anchor="middle" class="annotation">专家 1</text><path d="M66,130h108" stroke="#d5dfe0"/><rect class="prob-bar" data-expert="1" x="90" y="120.0" width="60" height="10.0" rx="2" fill="#8a74b5" fill-opacity=".7"/><text x="120" y="161" text-anchor="middle" class="prob-value">0.10</text><text x="120" y="194" text-anchor="middle" class="logit-value">logit -2.30</text><text x="330" y="21" text-anchor="middle" class="annotation">专家 2</text><path d="M276,130h108" stroke="#d5dfe0"/><rect class="prob-bar" data-expert="2" x="300" y="80.0" width="60" height="50.0" rx="2" fill="#8a74b5" fill-opacity=".7"/><text x="330" y="161" text-anchor="middle" class="prob-value">0.50</text><text x="330" y="194" text-anchor="middle" class="logit-value">logit -0.69</text><text x="540" y="21" text-anchor="middle" class="annotation">专家 3</text><path d="M486,130h108" stroke="#d5dfe0"/><rect class="prob-bar" data-expert="3" x="510" y="100.0" width="60" height="30.0" rx="2" fill="#8a74b5" fill-opacity=".7"/><text x="540" y="161" text-anchor="middle" class="prob-value">0.30</text><text x="540" y="194" text-anchor="middle" class="logit-value">logit -1.20</text><text x="750" y="21" text-anchor="middle" class="annotation">专家 4</text><path d="M696,130h108" stroke="#d5dfe0"/><rect class="prob-bar" data-expert="4" x="720" y="120.0" width="60" height="10.0" rx="2" fill="#8a74b5" fill-opacity=".7"/><text x="750" y="161" text-anchor="middle" class="prob-value">0.10</text><text x="750" y="194" text-anchor="middle" class="logit-value">logit -2.30</text></svg><path d="M34,370.0H1186" stroke="#e3e8e8"/><text x="34" y="410.0" text-anchor="start" class="shape">02</text><text x="34" y="441.0" text-anchor="start" class="operation">专家选择</text><text x="34" y="477.0" text-anchor="start" class="shape">取概率最大的两项，保留专</text><text x="34" y="502.0" text-anchor="start" class="shape">家编号，并将对应概率重新</text><text x="34" y="527.0" text-anchor="start" class="shape">归一化。</text><svg x="286" y="380.0" width="900" height="118.0" viewBox="0 0 900 118"><defs><marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#8c9291" stroke-width="1.2"/></marker></defs><text x="140" y="22" text-anchor="middle" class="annotation">选中编号（整数）</text><rect x="83" y="43" width="52" height="45" rx="3" class="index-slot"/><text x="109" y="73" text-anchor="middle" class="selected-id symbol">2</text><rect x="157" y="43" width="52" height="45" rx="3" class="index-slot"/><text x="183" y="73" text-anchor="middle" class="selected-id symbol">3</text><path class="arrow" d="M241,67H289" marker-end="url(#tip)"/><text x="411" y="22" text-anchor="middle" class="annotation">选中概率</text><text x="411" y="75" text-anchor="middle" class="selected-values symbol">(0.50, 0.30)</text><path class="arrow" d="M534,67H583" marker-end="url(#tip)"/><text x="730" y="22" text-anchor="middle" class="annotation">选中概率归一化</text><text x="730" y="75" text-anchor="middle" class="selected-weights symbol">(0.625, 0.375)</text></svg><path d="M34,570.0H1186" stroke="#e3e8e8"/><text x="34" y="610.0" text-anchor="start" class="shape">03</text><text x="34" y="641.0" text-anchor="start" class="operation">分发与汇总</text><text x="34" y="677.0" text-anchor="start" class="shape">输入 x 分发给选中的专家，</text><text x="34" y="702.0" text-anchor="start" class="shape">各专家输出按归一化权重求</text><text x="34" y="727.0" text-anchor="start" class="shape">和。</text><svg x="286" y="580.0" width="900" height="244.0" viewBox="0 0 900 244"><defs><marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#8c9291" stroke-width="1.2"/></marker></defs><text x="435" y="22" text-anchor="middle" class="symbol">输入 x</text><g class="route expert-route dim-path" data-expert="1"><path d="M435,34V50H120V75" class="branch" marker-end="url(#tip)"/><path d="M120,127V157H435V178" class="branch" marker-end="url(#tip)"/></g><g class="route expert-route" data-expert="2"><path d="M435,34V50H330V75" class="branch" marker-end="url(#tip)"/><path d="M330,127V157H435V178" class="branch" marker-end="url(#tip)"/></g><g class="route expert-route" data-expert="3"><path d="M435,34V50H540V75" class="branch" marker-end="url(#tip)"/><path d="M540,127V157H435V178" class="branch" marker-end="url(#tip)"/></g><g class="route expert-route dim-path" data-expert="4"><path d="M435,34V50H750V75" class="branch" marker-end="url(#tip)"/><path d="M750,127V157H435V178" class="branch" marker-end="url(#tip)"/></g><g class="expert dim-path" data-expert="1"><rect x="47" y="77" width="146" height="49" rx="3" class="operation-node"/><text x="120.0" y="107.5" text-anchor="middle" class="process k">专家 1</text></g><g class="expert" data-expert="2"><rect x="257" y="77" width="146" height="49" rx="3" class="operation-node"/><text x="330.0" y="107.5" text-anchor="middle" class="process k">专家 2</text></g><g class="expert" data-expert="3"><rect x="467" y="77" width="146" height="49" rx="3" class="operation-node"/><text x="540.0" y="107.5" text-anchor="middle" class="process k">专家 3</text></g><g class="expert dim-path" data-expert="4"><rect x="677" y="77" width="146" height="49" rx="3" class="operation-node"/><text x="750.0" y="107.5" text-anchor="middle" class="process k">专家 4</text></g><text x="435" y="214" text-anchor="middle" class="moe-result symbol">y = 0.625 f₂(x) + 0.375 f₃(x)</text></svg><text x="34" y="884.0" text-anchor="start" class="shape">维度：x 的形状为 1 × d，Router 权重为 d × E，取 E = 4。各专家输出均为 1 × d；图中节点表示专家身份。</text><text x="34" y="916.0" text-anchor="start" class="shape">对象：Top-k 返回按概率降序排列的专家编号，取值为 1 到 4 的整数。选中概率归一化后，两项混合权重之和为 1。</text><text x="34" y="948.0" text-anchor="start" class="shape">计算：示例采用 Mixtral 的选中概率归一化方式，路由分数取 log(p)。本 token 仅在选中的专家中进行前向计算。</text></svg>