<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MoE 的路由与加权汇总</title><link rel="stylesheet" href="/figures/figure.css"><script>if(new URLSearchParams(location.search).has('embed'))document.documentElement.classList.add('embedded');</script></head><body data-kind="moe"><main><header><h1>MoE 的路由与加权汇总</h1><p>Router 为每个 token 选择 4 个专家中的 2 个，并确定其输出的混合权重。</p></header><figure class="figure"><div class="controls"><div class="head-picker" role="group" aria-label="路由结果"><span>路由结果</span><button type="button" data-moe="a" aria-pressed="true">示例 A</button><button type="button" data-moe="b" aria-pressed="false">示例 B</button></div><p class="sharing" id="sharing" aria-live="polite">选择专家 2、3，混合权重为 0.625、0.375。</p></div><p class="mobile-hint">图示可左右滑动，保留矩阵比例与文字大小。</p><section class="stage "><div class="stage-copy"><span class="step">01</span><h2>路由概率</h2><p>路由分数 xW_r 经 softmax 转为专家概率，图中以柱高表示。</p></div><div class="diagram-scroll" tabindex="0" aria-label="路由概率，窄屏可横向滚动"><svg viewBox="0 0 900 225" role="img" aria-label="四个专家的概率柱和对应路由分数。"><defs><marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#8c9291" stroke-width="1.2"/></marker></defs><text x="120" y="21" text-anchor="middle" class="annotation">专家 1</text><path d="M66,130h108" stroke="#d5dfe0"/><rect class="prob-bar" data-expert="1" x="90" y="120.0" width="60" height="10.0" rx="2" fill="#8a74b5" fill-opacity=".7"/><text x="120" y="161" text-anchor="middle" class="prob-value">0.10</text><text x="120" y="194" text-anchor="middle" class="logit-value">logit -2.30</text><text x="330" y="21" text-anchor="middle" class="annotation">专家 2</text><path d="M276,130h108" stroke="#d5dfe0"/><rect class="prob-bar" data-expert="2" x="300" y="80.0" width="60" height="50.0" rx="2" fill="#8a74b5" fill-opacity=".7"/><text x="330" y="161" text-anchor="middle" class="prob-value">0.50</text><text x="330" y="194" text-anchor="middle" class="logit-value">logit -0.69</text><text x="540" y="21" text-anchor="middle" class="annotation">专家 3</text><path d="M486,130h108" stroke="#d5dfe0"/><rect class="prob-bar" data-expert="3" x="510" y="100.0" width="60" height="30.0" rx="2" fill="#8a74b5" fill-opacity=".7"/><text x="540" y="161" text-anchor="middle" class="prob-value">0.30</text><text x="540" y="194" text-anchor="middle" class="logit-value">logit -1.20</text><text x="750" y="21" text-anchor="middle" class="annotation">专家 4</text><path d="M696,130h108" stroke="#d5dfe0"/><rect class="prob-bar" data-expert="4" x="720" y="120.0" width="60" height="10.0" rx="2" fill="#8a74b5" fill-opacity=".7"/><text x="750" y="161" text-anchor="middle" class="prob-value">0.10</text><text x="750" y="194" text-anchor="middle" class="logit-value">logit -2.30</text></svg></div></section><section class="stage "><div class="stage-copy"><span class="step">02</span><h2>专家选择</h2><p>取概率最大的两项，保留专家编号，并将对应概率重新归一化。</p></div><div class="diagram-scroll" tabindex="0" aria-label="专家选择，窄屏可横向滚动"><svg viewBox="0 0 900 118" role="img" aria-label="选中专家编号二和三，对应概率零点五和零点三，归一化后为零点六二五和零点三七五。"><defs><marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#8c9291" stroke-width="1.2"/></marker></defs><text x="140" y="22" text-anchor="middle" class="annotation">选中编号（整数）</text><rect x="83" y="43" width="52" height="45" rx="3" class="index-slot"/><text x="109" y="73" text-anchor="middle" class="selected-id symbol">2</text><rect x="157" y="43" width="52" height="45" rx="3" class="index-slot"/><text x="183" y="73" text-anchor="middle" class="selected-id symbol">3</text><path class="arrow" d="M241,67H289" marker-end="url(#tip)"/><text x="411" y="22" text-anchor="middle" class="annotation">选中概率</text><text x="411" y="75" text-anchor="middle" class="selected-values symbol">(0.50, 0.30)</text><path class="arrow" d="M534,67H583" marker-end="url(#tip)"/><text x="730" y="22" text-anchor="middle" class="annotation">选中概率归一化</text><text x="730" y="75" text-anchor="middle" class="selected-weights symbol">(0.625, 0.375)</text></svg></div></section><section class="stage "><div class="stage-copy"><span class="step">03</span><h2>分发与汇总</h2><p>输入 x 分发给选中的专家，各专家输出按归一化权重求和。</p></div><div class="diagram-scroll" tabindex="0" aria-label="分发与汇总，窄屏可横向滚动"><svg viewBox="0 0 900 244" role="img" aria-label="同一个输入分发到选中的专家，再按归一化权重相加。"><defs><marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#8c9291" stroke-width="1.2"/></marker></defs><text x="435" y="22" text-anchor="middle" class="symbol">输入 x</text><g class="route expert-route dim-path" data-expert="1"><path d="M435,34V50H120V75" class="branch" marker-end="url(#tip)"/><path d="M120,127V157H435V178" class="branch" marker-end="url(#tip)"/></g><g class="route expert-route" data-expert="2"><path d="M435,34V50H330V75" class="branch" marker-end="url(#tip)"/><path d="M330,127V157H435V178" class="branch" marker-end="url(#tip)"/></g><g class="route expert-route" data-expert="3"><path d="M435,34V50H540V75" class="branch" marker-end="url(#tip)"/><path d="M540,127V157H435V178" class="branch" marker-end="url(#tip)"/></g><g class="route expert-route dim-path" data-expert="4"><path d="M435,34V50H750V75" class="branch" marker-end="url(#tip)"/><path d="M750,127V157H435V178" class="branch" marker-end="url(#tip)"/></g><g class="expert dim-path" data-expert="1"><rect x="47" y="77" width="146" height="49" rx="3" class="operation-node"/><text x="120.0" y="107.5" text-anchor="middle" class="process k">专家 1</text></g><g class="expert" data-expert="2"><rect x="257" y="77" width="146" height="49" rx="3" class="operation-node"/><text x="330.0" y="107.5" text-anchor="middle" class="process k">专家 2</text></g><g class="expert" data-expert="3"><rect x="467" y="77" width="146" height="49" rx="3" class="operation-node"/><text x="540.0" y="107.5" text-anchor="middle" class="process k">专家 3</text></g><g class="expert dim-path" data-expert="4"><rect x="677" y="77" width="146" height="49" rx="3" class="operation-node"/><text x="750.0" y="107.5" text-anchor="middle" class="process k">专家 4</text></g><text x="435" y="214" text-anchor="middle" class="moe-result symbol">y = 0.625 f₂(x) + 0.375 f₃(x)</text></svg></div></section><figcaption><dl class="notes"><dt>维度</dt><dd>x 的形状为 1 × d，Router 权重为 d × E，取 E = 4。各专家输出均为 1 × d；图中节点表示专家身份。</dd><dt>对象</dt><dd>Top-k 返回按概率降序排列的专家编号，取值为 1 到 4 的整数。选中概率归一化后，两项混合权重之和为 1。</dd><dt>计算</dt><dd>示例采用 Mixtral 的选中概率归一化方式，路由分数取 log(p)。本 token 仅在选中的专家中进行前向计算。</dd></dl></figcaption></figure><nav class="figure-footer" aria-label="图示文件"><a class="standalone-link" href="/figures/transformer-arithmetic/04-moe-routing/" target="_blank" rel="noopener">放大查看</a><a href="/images/transformer-arithmetic/04-moe-routing.svg" target="_blank" rel="noopener">静态矢量图</a></nav></main><script></script><script src="/figures/figure.js"></script></body></html>
