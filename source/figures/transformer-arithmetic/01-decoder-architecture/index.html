<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Transformer 的计算流程</title><link rel="stylesheet" href="/figures/figure.css"><script>if(new URLSearchParams(location.search).has('embed'))document.documentElement.classList.add('embedded');</script></head><body data-kind=""><main><header><h1>Transformer 的计算流程</h1><p>以 Pre-RMSNorm 结构为例，展示词嵌入、残差更新与输出投影。</p></header><figure class="figure"><p class="mobile-hint">图示可左右滑动，保留矩阵比例与文字大小。</p><section class="stage "><div class="stage-copy"><span class="step">01</span><h2>词嵌入</h2><p>根据 token ID 查表，得到对应的 d 维向量。</p></div><div class="diagram-scroll" tabindex="0" aria-label="词嵌入，窄屏可横向滚动"><svg viewBox="0 0 900 150" role="img" aria-label="token ID 经词嵌入表得到输入 X。"><defs><marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#8c9291" stroke-width="1.2"/></marker></defs><text x="35" y="69" text-anchor="start" class="symbol">token ID</text><path class="arrow" d="M125,64H175" marker-end="url(#tip)"/><rect x="197" y="29" width="227" height="70" rx="3" class="operation-node"/><text x="310.5" y="64.0" text-anchor="middle" class="process q">词嵌入查表</text><text x="310.5" y="89.0" text-anchor="middle" class="process-small">W_E：V × d</text><path class="arrow" d="M455,64H518" marker-end="url(#tip)"/><text x="609" y="68" text-anchor="middle" class="symbol">X</text><text x="609" y="104" text-anchor="middle" class="shape">B × T × d</text><text x="745" y="69" text-anchor="middle" class="annotation">输入表示</text></svg></div></section><section class="stage "><div class="stage-copy"><span class="step">02a</span><h2>Attention 子层</h2><p>归一化后的表示参与注意力计算，结果与输入 X 相加。</p></div><div class="diagram-scroll" tabindex="0" aria-label="Attention 子层，窄屏可横向滚动"><svg viewBox="0 0 900 180" role="img" aria-label="X 经归一化和 Attention 后加回残差，得到 H"><defs><marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#8c9291" stroke-width="1.2"/></marker></defs><path d="M75,100V40H651V81" class="branch" marker-end="url(#tip)"/><text x="362" y="19" text-anchor="middle" class="shape">残差支路 X</text><text x="56" y="107" text-anchor="middle" class="symbol">X</text><path class="arrow" d="M84,100H146" marker-end="url(#tip)"/><rect x="168" y="68" width="146" height="64" rx="3" class="operation-node"/><text x="241.0" y="106.0" text-anchor="middle" class="process ">RMSNorm</text><path class="arrow" d="M339,100H383" marker-end="url(#tip)"/><rect x="405" y="68" width="158" height="64" rx="3" class="operation-node"/><text x="484.0" y="106.0" text-anchor="middle" class="process q">Attention</text><path class="arrow" d="M588,100H627" marker-end="url(#tip)"/><circle cx="651" cy="100" r="17" fill="white" stroke="#89999d"/><text x="651" y="107" text-anchor="middle" class="op">+</text><path class="arrow" d="M691,100H745" marker-end="url(#tip)"/><text x="808" y="107" text-anchor="middle" class="symbol">H</text><text x="808" y="141" text-anchor="middle" class="shape">B × T × d</text></svg></div></section><section class="stage "><div class="stage-copy"><span class="step">02b</span><h2>FFN 子层</h2><p>H 经归一化与前馈变换后，通过残差相加得到 Y。</p></div><div class="diagram-scroll" tabindex="0" aria-label="FFN 子层，窄屏可横向滚动"><svg viewBox="0 0 900 180" role="img" aria-label="H 经归一化和 FFN / MoE 后加回残差，得到 Y"><defs><marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#8c9291" stroke-width="1.2"/></marker></defs><path d="M75,100V40H651V81" class="branch" marker-end="url(#tip)"/><text x="362" y="19" text-anchor="middle" class="shape">残差支路 H</text><text x="56" y="107" text-anchor="middle" class="symbol">H</text><path class="arrow" d="M84,100H146" marker-end="url(#tip)"/><rect x="168" y="68" width="146" height="64" rx="3" class="operation-node"/><text x="241.0" y="106.0" text-anchor="middle" class="process ">RMSNorm</text><path class="arrow" d="M339,100H383" marker-end="url(#tip)"/><rect x="405" y="68" width="158" height="64" rx="3" class="operation-node"/><text x="484.0" y="106.0" text-anchor="middle" class="process k">FFN / MoE</text><path class="arrow" d="M588,100H627" marker-end="url(#tip)"/><circle cx="651" cy="100" r="17" fill="white" stroke="#89999d"/><text x="651" y="107" text-anchor="middle" class="op">+</text><path class="arrow" d="M691,100H745" marker-end="url(#tip)"/><text x="808" y="107" text-anchor="middle" class="symbol">Y</text><text x="808" y="141" text-anchor="middle" class="shape">B × T × d</text></svg></div></section><section class="stage "><div class="stage-copy"><span class="step">03</span><h2>词表投影</h2><p>02a 与 02b 构成一个 Block。经过 L 层后，最终表示映射为词表分数。</p></div><div class="diagram-scroll" tabindex="0" aria-label="词表投影，窄屏可横向滚动"><svg viewBox="0 0 900 138" role="img" aria-label="最后一层输出经过最终归一化和词表输出投影得到 logits。"><defs><marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#8c9291" stroke-width="1.2"/></marker></defs><text x="39" y="65" text-anchor="middle" class="symbol">Yᴸ</text><path class="arrow" d="M81,59H132" marker-end="url(#tip)"/><rect x="157" y="28" width="191" height="65" rx="3" class="operation-node"/><text x="252.5" y="66.5" text-anchor="middle" class="process ">最终 RMSNorm</text><path class="arrow" d="M374,59H427" marker-end="url(#tip)"/><rect x="452" y="18" width="214" height="84" rx="3" class="operation-node"/><text x="559.0" y="60.0" text-anchor="middle" class="process v">输出头 W_U</text><text x="559.0" y="85.0" text-anchor="middle" class="process-small">d × V</text><path class="arrow" d="M692,59H743" marker-end="url(#tip)"/><text x="811" y="60" text-anchor="middle" class="symbol">logits</text><text x="811" y="94" text-anchor="middle" class="shape">B × T × V</text></svg></div></section><figcaption><dl class="notes"><dt>维度</dt><dd>B 为批大小，T 为序列长度，d 为隐藏维度，V 为词表大小。各 Block 的输入输出形状均为 B × T × d。</dd><dt>对象</dt><dd>方框表示计算操作。token ID 为离散编号，残差流中的表示为实数向量，logits 为未归一化的词表分数。</dd><dt>参数</dt><dd>可学习参数来自 Norm 的缩放、线性投影和嵌入表。残差相加、mask 与本文采用的 RoPE 不引入参数。</dd></dl></figcaption></figure><nav class="figure-footer" aria-label="图示文件"><a class="standalone-link" href="/figures/transformer-arithmetic/01-decoder-architecture/" target="_blank" rel="noopener">放大查看</a><a href="/images/transformer-arithmetic/01-decoder-architecture.svg" target="_blank" rel="noopener">静态矢量图</a></nav></main><script></script><script src="/figures/figure.js"></script></body></html>
