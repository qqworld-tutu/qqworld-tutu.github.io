<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>一个期望的梯度，有两条路径</title><link rel="stylesheet" href="/figures/figure.css?v=7da6440f42fc"><script>if(new URLSearchParams(location.search).has('embed'))document.documentElement.classList.add('embedded');</script></head><body data-kind="gradient"><main><header><h1>一个期望的梯度，有两条路径</h1><p>参数 θ 既影响回答出现的概率，也影响同一条回答上的公式。</p><div class="formula long">∇<sub>θ</sub> E<sub>Pθ</sub>[k<sub>θ</sub>] = E<sub>Pθ</sub>[<span class="probability">k<sub>θ</sub> ∇<sub>θ</sub> log P<sub>θ</sub></span> + <span class="direct">∇<sub>θ</sub> k<sub>θ</sub></span>]</div></header><figure class="figure"><div class="controls"><div class="head-picker" role="group" aria-label="查看路径"><span>查看路径</span><button type="button" data-path="all" aria-pressed="true">完整梯度</button><button type="button" data-path="prob" aria-pressed="false">概率路径</button><button type="button" data-path="direct" aria-pressed="false">直接反传</button></div><p class="sharing" id="sharing" aria-live="polite">完整梯度包含两项。</p></div><p class="mobile-hint">图示可左右滑动，保留矩阵比例与文字大小。</p><section class="stage gradient-path probability-path"><div class="stage-copy"><span class="step">01</span><h2>概率路径</h2><p>哪些回答更常出现？这项由 policy gradient 计算，k 在这一项中停止梯度。</p></div><div class="diagram-scroll" tabindex="0" aria-label="概率路径，窄屏可横向滚动"><svg viewBox="0 0 900 127" role="img" aria-label="参数通过采样概率的变化贡献梯度。"><defs><marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#8c9291" stroke-width="1.2"/></marker></defs><text x="45" y="65" text-anchor="middle" class="symbol">θ</text><path class="arrow" d="M85,59H146" marker-end="url(#tip)"/><rect x="169" y="25" width="170" height="68" rx="3" class="operation-node"/><text x="254.0" y="65.0" text-anchor="middle" class="process q">Pθ(y)</text><path class="arrow" d="M367,59H424" marker-end="url(#tip)"/><text x="610" y="64" text-anchor="middle" class="symbol">kθ(y) ∇θ log Pθ(y)</text></svg></div></section><section class="stage gradient-path direct-path"><div class="stage-copy"><span class="step">02</span><h2>公式路径</h2><p>固定已经采到的回答，k 的值怎样变化？直接把 k 放进 loss 反传，计算的是这一项。</p></div><div class="diagram-scroll" tabindex="0" aria-label="公式路径，窄屏可横向滚动"><svg viewBox="0 0 900 127" role="img" aria-label="参数通过固定样本公式的变化贡献梯度。"><defs><marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#8c9291" stroke-width="1.2"/></marker></defs><text x="45" y="65" text-anchor="middle" class="symbol">θ</text><path class="arrow" d="M85,59H146" marker-end="url(#tip)"/><rect x="169" y="25" width="170" height="68" rx="3" class="operation-node"/><text x="254.0" y="65.0" text-anchor="middle" class="process v">kθ(y)</text><path class="arrow" d="M367,59H424" marker-end="url(#tip)"/><text x="610" y="64" text-anchor="middle" class="symbol">∇θ kθ(y)</text></svg></div></section><figcaption><dl class="notes"><dt>对象</dt><dd>Pθ(y) 是采样概率，kθ(y) 是样本上的实数函数；参考分布视为固定。</dd><dt>机制</dt><dd>完整求导要对两项一起取期望。直接对固定样本反传，不会自动补上采样概率变化的贡献。</dd><dt>符号</dt><dd>图示为 E[k] 的梯度。最小化 KL 时，策略奖励中的相应惩罚写为 −β stop-gradient(k)。</dd></dl></figcaption></figure><nav class="figure-footer" aria-label="图示文件"><a class="standalone-link" href="/figures/kl-divergence/03-gradient-paths/" target="_blank" rel="noopener">放大查看</a><a href="/images/kl-divergence/03-gradient-paths.svg" target="_blank" rel="noopener">静态矢量图</a></nav></main><script></script><script src="/figures/figure.js?v=522346770423"></script></body></html>
