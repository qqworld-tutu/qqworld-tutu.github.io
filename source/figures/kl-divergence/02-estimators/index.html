<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>估计值的形状，与估计量的方差</title><link rel="stylesheet" href="/figures/figure.css?v=d6dbc7e4cf76"><script>if(new URLSearchParams(location.search).has('embed'))document.documentElement.classList.add('embedded');</script></head><body data-kind=""><main><header><h1>估计值的形状，与估计量的方差</h1><p>k₁、k₂、k₃ 在原点附近很接近；离开局部区域，它们的数值和方差会显著分离。</p></header><figure class="figure"><p class="mobile-hint">图示可左右滑动，保留矩阵比例与文字大小。</p><section class="stage chart-stage"><div class="stage-copy"><span class="step">01</span><h2>单样本数值</h2><p>横轴 u = log(P / Q)。k₁ 可以为负；k₂ 非负但有偏；k₃ 非负且有指数尾部。</p></div><div class="diagram-scroll" tabindex="0" aria-label="单样本数值，窄屏可横向滚动"><img src="/images/kl-divergence/02-estimators-shape.svg" alt="三个估计量随 log-ratio 变化的曲线。"></div></section><section class="stage chart-stage"><div class="stage-copy"><span class="step">02</span><h2>相对标准差</h2><p>单位方差高斯中，均值差 δ 增大时，k₃ 的相对标准差也可能迅速升高。</p></div><div class="diagram-scroll" tabindex="0" aria-label="相对标准差，窄屏可横向滚动"><img src="/images/kl-divergence/02-estimators-variance.svg" alt="三个估计量的标准差除以真实 KL，随高斯均值差变化。"></div></section><figcaption><dl class="notes"><dt>定义</dt><dd>u = log(P / Q)，k₁ = u，k₂ = u² / 2，k₃ = exp(−u) − 1 + u。</dd><dt>例子</dt><dd>样本取自 P = N(δ, 1)，Q = N(0, 1)，真实 KL = δ² / 2；第二张图显示标准差 / 真实 KL。</dd><dt>边界</dt><dd>k₂ 有偏；第二张图只比较标准差，不包含偏差，不是均方误差比较。</dd></dl></figcaption></figure><nav class="figure-footer" aria-label="图示文件"><a class="standalone-link" href="/figures/kl-divergence/02-estimators/" target="_blank" rel="noopener">放大查看</a><a href="/images/kl-divergence/02-estimators.svg" target="_blank" rel="noopener">静态矢量图</a></nav></main><script></script><script src="/figures/figure.js?v=522346770423"></script></body></html>
