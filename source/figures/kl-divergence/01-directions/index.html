<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>同一个参考分布，两种 KL 方向</title><link rel="stylesheet" href="/figures/figure.css"><script>if(new URLSearchParams(location.search).has('embed'))document.documentElement.classList.add('embedded');</script></head><body data-kind=""><main><header><h1>同一个参考分布，两种 KL 方向</h1><p>把双峰参考分布 Q，用一个高斯 P 来拟合。改变 KL 的方向，就改变了平均误差的位置。</p><div class="formula long"><span>D<sub>reverse</sub> = E<sub>P</sub>[log(P / Q)]</span><span>D<sub>forward</sub> = E<sub>Q</sub>[log(Q / P)]</span></div></header><figure class="figure"><p class="mobile-hint">图示可左右滑动，保留矩阵比例与文字大小。</p><section class="stage chart-stage"><div class="stage-copy"><span class="step">P → Q</span><h2>Reverse KL</h2><p>从 P 采样，惩罚 P 把质量放在 Q 很小的区域；这个例子中最优解靠近一个峰。</p></div><div class="diagram-scroll" tabindex="0" aria-label="Reverse KL，窄屏可横向滚动"><img src="/images/kl-divergence/01-directions-reverse.svg" alt="双峰参考分布和反向 KL 拟合的单峰高斯。"></div></section><section class="stage chart-stage"><div class="stage-copy"><span class="step">Q → P</span><h2>Forward KL</h2><p>从 Q 采样，P 必须照顾两个峰；单个高斯用更大的方差覆盖它们。</p></div><div class="diagram-scroll" tabindex="0" aria-label="Forward KL，窄屏可横向滚动"><img src="/images/kl-divergence/01-directions-forward.svg" alt="双峰参考分布和前向 KL 拟合的宽高斯。"></div></section><figcaption><dl class="notes"><dt>分布</dt><dd>Q = ½ N(−3, 1) + ½ N(3, 1)；P 限制为一个高斯，横轴为样本取值，纵轴为概率密度。</dd><dt>拟合</dt><dd>Reverse KL 取右峰的对称最优解：μ ≈ 2.984，σ ≈ 1.023；Forward KL 为 μ = 0，σ = √10。</dd><dt>边界</dt><dd>“选峰 / 覆盖”是这个受限拟合例子的表现，不是任意分布族和优化过程都满足的定理。</dd></dl></figcaption></figure><nav class="figure-footer" aria-label="图示文件"><a class="standalone-link" href="/figures/kl-divergence/01-directions/" target="_blank" rel="noopener">放大查看</a><a href="/images/kl-divergence/01-directions.svg" target="_blank" rel="noopener">静态矢量图</a></nav></main><script></script><script src="/figures/figure.js"></script></body></html>
