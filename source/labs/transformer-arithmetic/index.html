<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transformer 参数与 KV Cache 计算器</title><link rel="stylesheet" href="../lab.css"><script src="calculator.js" defer></script></head>
<body><main><h1>同一个模型，四种大小</h1><p class="intro">选择配置，再改变 KV 头、缓存长度与 batch。所有结果按矩阵形状实时计算。</p>
<label>模型配置<select id="model"><option value="llama3">Llama-3 8B · GQA</option><option value="llama2">Llama-2 7B · MHA</option><option value="mixtral">Mixtral 8×7B · 8 专家 / 选 2</option></select></label>
<p id="config" class="note"></p>
<div class="controls">
<label>KV 头数<select id="kv"><option>1</option><option>2</option><option>4</option><option selected>8</option><option>16</option><option>32</option></select></label>
<label>权重与 KV 精度<select id="precision"><option value="2">BF16 / FP16 · 2 字节</option><option value="4">FP32 · 4 字节</option></select></label>
<label>缓存长度 T：<output id="length-value" for="length">8192</output><input id="length" type="range" min="1024" max="32768" step="1024" value="8192"></label>
<label>Batch B：<output id="batch-value" for="batch">1</output><input id="batch" type="range" min="1" max="16" value="1"></label>
</div><div class="metrics" aria-live="polite" aria-atomic="true">
<div class="metric"><span>总参数</span><strong id="total">—</strong></div><div class="metric"><span>每 token 激活参数（模块口径）</span><strong id="active">—</strong></div>
<div class="metric"><span>全部权重的理想存储</span><strong id="weight">—</strong></div><div class="metric"><span>所有序列的 KV 数据</span><strong id="cache">—</strong></div></div>
<p id="formula" class="note"></p><p id="context" class="notice"></p>
<p class="note">固定 32 层、隐藏维度 4096、32 个 Query 头、每头 128 维、无 bias、SwiGLU、两端不共享。改变 KV 头得到的是假设架构，不能直接修改已有模型权重。未计激活、工作区、框架和分配开销；模型上下文上限另行约束。</p>
<noscript><p>交互需要 JavaScript。正文中的公式和默认例子无需 JavaScript 即可阅读。</p></noscript></main></body></html>
